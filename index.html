<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>Telemetria Carrello</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        /* Pannelli delle schermate principali */
        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Schermata Principale (Grafico o Mappa) */
        #screen-telemetry {
            z-index: 2;
        }

        /* Schermata Inclinometri */
        #screen-clinometer {
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            transform: translateX(20px);
            background: radial-gradient(circle at center, #1e1e1e 0%, #121212 100%);
        }

        /* Gestione visibilità schermate */
        #screen-clinometer.active-screen {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }
        #screen-telemetry.hidden-screen {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-20px);
        }

        /* Stile Schermata Principale - Metà Superiore: Tachimetro */
        .speed-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #2a2a2a;
            background: radial-gradient(circle at center, #1e1e1e 0%, #121212 100%);
        }
        .speed-display {
            font-size: 5.5rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
        }
        .speed-unit {
            font-size: 1.2rem;
            color: #ff9500;
            font-weight: 600;
            margin-top: 5px;
            letter-spacing: 2px;
        }
        
        /* Stile Schermata Principale - Metà Inferiore: Grafico o Navigatore */
        .bottom-section {
            flex: 1;
            position: relative;
            background-color: #181818;
        }
        .view-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.3s ease;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
        #nav-panel iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Stile Schermata Inclinometri */
        .top-section-clinometer {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            padding: 8px 0;
        }
        .speed-bar {
            font-size: 0.9rem;
            color: #ff9500;
            font-weight: 600;
            letter-spacing: 1px;
            background: rgba(255, 149, 0, 0.1);
            padding: 3px 12px;
            border-radius: 15px;
            border: 1px solid rgba(255, 149, 0, 0.3);
        }
        .clinometers-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .gauge-box {
            width: 115px;
            height: 115px;
            background-color: #0d0d0d;
            border: 3px solid #333333;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .horizon-line {
            position: absolute;
            width: 65px;
            height: 2px;
            background-color: #cccccc;
            transition: transform 0.1s linear;
        }
        .gauge-center-icon {
            position: absolute;
            z-index: 2;
            width: 30px;
            height: 30px;
            fill: #cccccc;
        }
        .gauge-label {
            position: absolute;
            bottom: 10px;
            font-size: 0.55rem;
            color: #888888;
            letter-spacing: 1px;
        }

        .bottom-section-clinometer {
            flex: 1;
            background-color: #181818;
            border-top: 2px solid #2a2a2a;
            position: relative;
        }
        #nav-panel-2 iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Pulsante Freccia Arancione Universale */
        .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1000;
            background-color: #ff9500;
            color: #121212;
            border: none;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(255, 149, 0, 0.4);
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .toggle-btn:active {
            transform: translateY(-50%) scale(0.9);
            background-color: #e08300;
        }
        .toggle-btn svg {
            width: 22px;
            height: 22px;
            fill: #121212;
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- SCHERMATA 1 & 2: Tachimetro (Sopra) + Grafico o Mappa (Sotto) -->
        <div id="screen-telemetry" class="main-panel">
            <div class="speed-section">
                <div id="speed" class="speed-display">0</div>
                <div class="speed-unit">KM/H</div>
            </div>

            <div class="bottom-section">
                <div id="chart-panel" class="view-panel">
                    <canvas id="speedChart"></canvas>
                </div>
                <div id="nav-panel" class="view-panel hidden">
                    <iframe id="map-frame" src="https://www.openstreetmap.org/export/embed.html"></iframe>
                </div>
            </div>
        </div>

        <!-- SCHERMATA 3: Inclinometri del Carrello (Sopra) + Mini Mappa (Sotto) -->
        <div id="screen-clinometer" class="main-panel">
            <div class="top-section-clinometer">
                <div class="speed-bar">
                    VELOCITÀ: <span id="speed-clinometer">0</span> KM/H
                </div>

                <div class="clinometers-container">
                    <div class="gauge-box">
                        <div id="roll-horizon" class="horizon-line"></div>
                        <svg class="gauge-center-icon" viewBox="0 0 24 24">
                            <path d="M4 4h16l-2 9H6L4 4zm2 11h12v2H6v-2zm3 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/>
                        </svg>
                        <span class="gauge-label">ROLLIO</span>
                    </div>

                    <div class="gauge-box">
                        <div id="pitch-horizon" class="horizon-line"></div>
                        <svg class="gauge-center-icon" viewBox="0 0 24 24">
                            <path d="M2 5h3l2 9h10l2-6H8M7 16a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>
                        </svg>
                        <span class="gauge-label">BECCHEGGIO</span>
                    </div>
                </div>
            </div>

            <div class="bottom-section-clinometer">
                <div id="nav-panel-2" class="view-panel">
                    <iframe id="map-frame-2" src="https://www.openstreetmap.org/export/embed.html"></iframe>
                </div>
            </div>
        </div>

        <!-- Pulsante Freccia Arancione -->
        <button id="toggleViewBtn" class="toggle-btn" aria-label="Cambia Vista">
            <svg viewBox="0 0 24 24">
                <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
            </svg>
        </button>

    </div>

    <script>
        // Configurazione Grafico Chart.js
        const ctx = document.getElementById('speedChart').getContext('2d');
        const maxDataPoints = 30;
        const speedData = Array(maxDataPoints).fill(0);
        const labels = Array(maxDataPoints).fill('');

        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    data: speedData,
                    borderColor: '#ff9500',
                    borderWidth: 2.5,
                    fill: true,
                    backgroundColor: 'rgba(255, 149, 0, 0.15)',
                    tension: 0.3,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false },
                    y: {
                        beginAtZero: true,
                        grid: { color: '#2a2a2a' },
                        ticks: { color: '#888888' }
                    }
                }
            }
        });

        // Inclinometro Sensori Telefono
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (event) => {
                let roll = Math.max(-45, Math.min(45, event.gamma || 0));
                let pitch = Math.max(-45, Math.min(45, event.beta || 0));
                document.getElementById('roll-horizon').style.transform = `rotate(${roll}deg)`;
                document.getElementById('pitch-horizon').style.transform = `rotate(${pitch}deg)`;
            }, true);
        }

        // GPS e Velocità
        let currentSpeed = 0;
        let displayedSpeed = 0;

        function animateSpeed() {
            displayedSpeed += (currentSpeed - displayedSpeed) * 0.1;
            const roundedSpeed = Math.round(displayedSpeed);
            document.getElementById('speed').textContent = roundedSpeed;
            document.getElementById('speed-clinometer').textContent = roundedSpeed;
            requestAnimationFrame(animateSpeed);
        }
        animateSpeed();

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    const speedMs = position.coords.speed || 0;
                    currentSpeed = Math.max(0, speedMs * 3.6);

                    speedData.push(currentSpeed);
                    speedData.shift();
                    chart.update();

                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    const mapUrl = `https://www.openstreetmap.org/export/embed.html?bbox=${lon-0.005}%2C${lat-0.005}%2C${lon+0.005}%2C${lat+0.005}&layer=mapnik&marker=${lat}%2C${lon}`;
                    document.getElementById('map-frame').src = mapUrl;
                    document.getElementById('map-frame-2').src = mapUrl;
                },
                (error) => console.log(error),
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }

        // Gestione Sequenziale a 3 Passaggi tramite il Pulsante Arancione:
        // 0 -> Tachimetro + Grafico
        // 1 -> Tachimetro + Mappa
        // 2 -> Inclinometri Carrello + Mappa secondaria
        let viewMode = 0; 
        const toggleBtn = document.getElementById('toggleViewBtn');
        const screenTelemetry = document.getElementById('screen-telemetry');
        const screenClinometer = document.getElementById('screen-clinometer');
        const chartPanel = document.getElementById('chart-panel');
        const navPanel = document.getElementById('nav-panel');

        toggleBtn.addEventListener('click', () => {
            viewMode = (viewMode + 1) % 3;

            if (viewMode === 0) {
                // 1º Click di ritorno: Tachimetro + Grafico
                screenClinometer.classList.remove('active-screen');
                screenTelemetry.classList.remove('hidden-screen');
                chartPanel.classList.remove('hidden');
                navPanel.classList.add('hidden');
            } 
            else if (viewMode === 1) {
                // 2º Click: Tachimetro + Mappa (come l'app originale)
                screenClinometer.classList.remove('active-screen');
                screenTelemetry.classList.remove('hidden-screen');
                chartPanel.classList.add('hidden');
                navPanel.classList.remove('hidden');
            } 
            else if (viewMode === 2) {
                // 3º Click: Schermata Inclinometri con il carrello
                screenTelemetry.classList.add('hidden-screen');
                screenClinometer.classList.add('active-screen');
            }
        });

        // Wake Lock (Schermo sempre attivo)
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log(`Errore Wake Lock: ${err.name}, ${err.message}`);
            }
        }
        requestWakeLock();
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });
    </script>
</body>
</html>
