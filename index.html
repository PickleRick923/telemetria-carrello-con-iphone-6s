<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telemetria ESSENZIALE</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #0f0f0f; 
      color: #fff; 
      height: 100vh; 
      overflow: hidden; 
    }
    
    .dashboard { display: flex; height: 100vh; width: 100vw; }
    
    /* LATO SINISTRO: Velocità Attuale */
    .left-panel { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      border-right: 1px solid #222; 
    }
    .speed-val { 
      font-size: 7.5rem; 
      font-weight: 800; 
      color: #ffffff; 
      line-height: 0.9; 
      letter-spacing: -2px;
    }
    .unit { 
      font-size: 1.2rem; 
      color: #555; 
      font-weight: 600;
      text-transform: uppercase; 
      margin-top: 10px;
    }

    /* LATO DESTRO: Media + Grafico ECG */
    .right-panel { 
      flex: 1.2; 
      display: flex; 
      flex-direction: column; 
      padding: 20px;
      justify-content: space-between;
    }
    
    .avg-box {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ff9500; /* Arancione stile iOS */
      background: #1c1c1e;
      padding: 8px 16px;
      border-radius: 8px;
      align-self: flex-start;
      letter-spacing: 0.5px;
    }

    .chart-container { 
      flex: 1; 
      width: 100%;
      margin-top: 15px;
      position: relative; 
    }
  </style>
</head>
<body>

<div class="dashboard">
  <!-- SINISTRA -->
  <div class="left-panel">
    <div class="speed-val" id="speed">0</div>
    <div class="unit">km/h</div>
  </div>

  <!-- DESTRA -->
  <div class="right-panel">
    <div class="avg-box">
      MEDIA: <span id="avg-speed">0.0</span> km/h
    </div>
    
    <div class="chart-container">
      <canvas id="ecgChart"></canvas>
    </div>
  </div>
</div>

<script>
  let speedHistory = [];
  const maxSamples = 40; // Numero di punti visibili nel grafico ECG

  let currentSpeed = 0;
  let targetSpeed = 0;

  // Configurazione Grafico Stile ECG
  const ctx = document.getElementById('ecgChart').getContext('2d');
  const ecgChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: Array(maxSamples).fill(''),
      datasets: [{
        data: Array(maxSamples).fill(0),
        borderColor: '#ff9500', // Linea Arancione
        borderWidth: 2,
        pointRadius: 0, // Nasconde i pallini per un effetto linea fluida
        tension: 0.2,   // Leggera curvatura stile impulso
        fill: false
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false, // Disabilita animazioni pesanti per massima reattività
      
      scales: {
        y: { 
          beginAtZero: true, 
          grid: { color: '#1a1a1a' }, 
          ticks: { display: false } // Rimuove i numeri sull'asse Y
        },
        x: { 
          grid: { display: false } 
        }
      },
      plugins: { 
        legend: { display: false }
      }
    }
  });

  // Animazione fluida a 60 FPS per il numero della velocità
  function animateSpeed() {
    currentSpeed += (targetSpeed - currentSpeed) * 0.1;
    
    const speedEl = document.getElementById('speed');
    if (speedEl) {
      speedEl.innerText = Math.round(currentSpeed);
    }

    requestAnimationFrame(animateSpeed);
  }
  requestAnimationFrame(animateSpeed);

  // Lettura GPS ad altissima frequenza
  if ("geolocation" in navigator) {
    navigator.geolocation.watchPosition(
      (pos) => {
        let rawSpeed = pos.coords.speed ? (pos.coords.speed * 3.6) : 0;
        targetSpeed = rawSpeed;

        // Calcolo Velocità Media
        speedHistory.push(rawSpeed);
        let sum = speedHistory.reduce((a, b) => a + b, 0);
        let avg = (sum / speedHistory.length).toFixed(1);
        document.getElementById('avg-speed').innerText = avg;

        // Update Grafico ECG senza scatti
        ecgChart.data.datasets[0].data.shift();
        ecgChart.data.datasets[0].data.push(rawSpeed);
        ecgChart.update('none'); // Update istantaneo
      },
      (err) => console.warn('Errore GPS: ' + err.message),
      { 
        enableHighAccuracy: true, 
        maximumAge: 0, 
        timeout: 5000 
      }
    );
  }
</script>

</body>
</html>
