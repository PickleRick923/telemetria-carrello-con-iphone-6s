<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>Telemetria Carrello</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        /* Metà Superiore: Velocità + Inclinometri in verticale */
        .top-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            background: radial-gradient(circle at center, #1e1e1e 0%, #121212 100%);
            border-bottom: 2px solid #2a2a2a;
            padding: 8px 0;
        }

        /* Riga velocità compatta in alto */
        .speed-bar {
            font-size: 0.9rem;
            color: #ff9500;
            font-weight: 600;
            letter-spacing: 1px;
            background: rgba(255, 149, 0, 0.1);
            padding: 3px 12px;
            border-radius: 15px;
            border: 1px solid rgba(255, 149, 0, 0.3);
        }

        /* Container dei quadranti in colonna (uno sopra l'altro) */
        .clinometers-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .gauge-box {
            width: 115px;
            height: 115px;
            background-color: #0d0d0d;
            border: 3px solid #333333;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        /* Lancetta / Linea orizzontale inclinabile */
        .horizon-line {
            position: absolute;
            width: 65px;
            height: 2px;
            background-color: #cccccc;
            transition: transform 0.1s linear;
        }

        .gauge-center-icon {
            position: absolute;
            z-index: 2;
            width: 30px;
            height: 30px;
            fill: #cccccc;
        }

        .gauge-label {
            position: absolute;
            bottom: 10px;
            font-size: 0.55rem;
            color: #888888;
            letter-spacing: 1px;
        }

        /* Metà Inferiore: Grafico o Navigatore */
        .bottom-section {
            flex: 1;
            position: relative;
            background-color: #181818;
        }
        .view-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateX(20px);
        }
        
        #nav-panel iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Pulsante Freccia Arancione */
        .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            background-color: #ff9500;
            color: #121212;
            border: none;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(255, 149, 0, 0.4);
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .toggle-btn:active {
            transform: translateY(-50%) scale(0.9);
            background-color: #e08300;
        }
        .toggle-btn svg {
            width: 22px;
            height: 22px;
            fill: #121212;
            transition: transform 0.3s ease;
        }
        .toggle-btn.active svg {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Metà Superiore: Velocità compatta + Inclinometri in verticale -->
        <div class="top-section">
            <div class="speed-bar">
                VELOCITÀ: <span id="speed">0</span> KM/H
            </div>

            <div class="clinometers-container">
                <!-- Quadrante Sopra: Rollio (Fronte carrello) -->
                <div class="gauge-box">
                    <div id="roll-horizon" class="horizon-line"></div>
                    <svg class="gauge-center-icon" viewBox="0 0 24 24">
                        <path d="M4 4h16l-2 9H6L4 4zm2 11h12v2H6v-2zm3 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/>
                    </svg>
                    <span class="gauge-label">ROLLIO</span>
                </div>

                <!-- Quadrante Sotto: Beccheggio (Profilo carrello) -->
                <div class="gauge-box">
                    <div id="pitch-horizon" class="horizon-line"></div>
                    <svg class="gauge-center-icon" viewBox="0 0 24 24">
                        <path d="M2 5h3l2 9h10l2-6H8M7 16a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>
                    </svg>
                    <span class="gauge-label">BECCHEGGIO</span>
                </div>
            </div>
        </div>

        <!-- Metà Inferiore: Grafico o Navigatore -->
        <div class="bottom-section">
            <div id="chart-panel" class="view-panel">
                <canvas id="speedChart"></canvas>
            </div>

            <div id="nav-panel" class="view-panel hidden">
                <iframe id="map-frame" src="https://www.openstreetmap.org/export/embed.html"></iframe>
            </div>

            <button id="toggleViewBtn" class="toggle-btn" aria-label="Cambia Vista">
                <svg viewBox="0 0 24 24">
                    <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // Configurazione Grafico Chart.js
        const ctx = document.getElementById('speedChart').getContext('2d');
        const maxDataPoints = 30;
        const speedData = Array(maxDataPoints).fill(0);
        const labels = Array(maxDataPoints).fill('');

        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    data: speedData,
                    borderColor: '#ff9500',
                    borderWidth: 2.5,
                    fill: true,
                    backgroundColor: 'rgba(255, 149, 0, 0.15)',
                    tension: 0.3,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false },
                    y: {
                        beginAtZero: true,
                        grid: { color: '#2a2a2a' },
                        ticks: { color: '#888888' }
                    }
                }
            }
        });

        // Gestione Inclinometro tramite Sensori Telefono (DeviceOrientation)
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (event) => {
                let roll = event.gamma || 0;
                let pitch = event.beta || 0;

                roll = Math.max(-45, Math.min(45, roll));
                pitch = Math.max(-45, Math.min(45, pitch));

                document.getElementById('roll-horizon').style.transform = `rotate(${roll}deg)`;
                document.getElementById('pitch-horizon').style.transform = `rotate(${pitch}deg)`;
            }, true);
        }

        // Tracciamento GPS e Velocità
        let currentSpeed = 0;
        let displayedSpeed = 0;

        function animateSpeed() {
            displayedSpeed += (currentSpeed - displayedSpeed) * 0.1;
            document.getElementById('speed').textContent = Math.round(displayedSpeed);
            requestAnimationFrame(animateSpeed);
        }
        animateSpeed();

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    const speedMs = position.coords.speed || 0;
                    currentSpeed = Math.max(0, speedMs * 3.6);

                    speedData.push(currentSpeed);
                    speedData.shift();
                    chart.update();

                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const mapFrame = document.getElementById('map-frame');
                    if (mapFrame && lat && lon) {
                        mapFrame.src = `https://www.openstreetmap.org/export/embed.html?bbox=${lon-0.005}%2C${lat-0.005}%2C${lon+0.005}%2C${lat+0.005}&layer=mapnik&marker=${lat}%2C${lon}`;
                    }
                },
                (error) => console.log(error),
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }

        // Gestione Cambio Vista (Grafico / Navigatore)
        const toggleBtn = document.getElementById('toggleViewBtn');
        const chartPanel = document.getElementById('chart-panel');
        const navPanel = document.getElementById('nav-panel');

        toggleBtn.addEventListener('click', () => {
            const isChartVisible = !chartPanel.classList.contains('hidden');
            if (isChartVisible) {
                chartPanel.classList.add('hidden');
                navPanel.classList.remove('hidden');
                toggleBtn.classList.add('active');
            } else {
                navPanel.classList.add('hidden');
                chartPanel.classList.remove('hidden');
                toggleBtn.classList.remove('active');
            }
        });

        // Mantiene lo schermo attivo (Wake Lock)
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log(`Errore Wake Lock: ${err.name}, ${err.message}`);
            }
        }
        requestWakeLock();
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });
    </script>
</body>
</html>
